{{define "fragment:connectivity-result"}}
<div class="space-y-2">
    {{range .Results}}
    <div class="card bg-base-200/50 border border-base-300">
        <div class="card-body p-3">
            <div class="flex items-center gap-2">
                {{if .Skipped}}
                    <span class="inline-block h-2 w-2 rounded-full bg-base-content/30 shrink-0"></span>
                {{else if .OK}}
                    <span class="inline-block h-2 w-2 rounded-full bg-success shadow-[0_0_0_3px_rgba(34,197,94,0.2)] shrink-0"></span>
                {{else}}
                    <span class="inline-block h-2 w-2 rounded-full bg-error shadow-[0_0_0_3px_rgba(239,68,68,0.2)] shrink-0"></span>
                {{end}}
                <strong class="text-sm">{{.Label}}</strong>
                {{if not .Skipped}}
                    <span class="ml-auto text-xs text-base-content/50 font-mono">{{.CostMs}} ms</span>
                {{end}}
            </div>
            {{if .URL}}
                <div class="font-mono text-xs text-base-content/50 truncate mt-1" title="{{.URL}}">{{.URL}}</div>
            {{end}}
            <div class="text-sm mt-1{{if not .Skipped}}{{if not .OK}} text-error{{end}}{{else}} text-base-content/50{{end}}">{{.Message}}</div>
        </div>
    </div>
    {{end}}
</div>
{{end}}
